name: Cryonix Launcher CI

on:
  push:
  workflow_dispatch:
  pull_request:
    types: [labeled]

jobs:
  build:
    runs-on: ubuntu-22.04
    env:
      UPLOAD_KEYSTORE_PASSWORD: ${{ secrets.UPLOAD_NEXT_KEYSTORE_PASSWORD }}
      MOJOPUB_KEYSTORE_PASSWORD: ${{ secrets.RELEASE_NEXT_KEYSTORE_PASSWORD }}
      CURSEFORGE_API_KEY: ${{ secrets.CURSEFORGE_API_KEY }}
    steps:
      - name: Checkout
        uses: actions/checkout@v3
        with:
          submodules: true

      - name: Get LTW
        uses: dawidd6/action-download-artifact@v6
        continue-on-error: true
        with:
          repo: MojoLauncher/LTW
          workflow: android.yml
          workflow_conclusion: success
          name: output-aar
          path: cryonixlauncher/libs

      - name: Get Mesa
        uses: dawidd6/action-download-artifact@v6  
        continue-on-error: true
        with:
          github_token: ${{ secrets.MESA_ACTIONS }}
          repo: MojoLauncher/mesa-unified2
          workflow: android.yml
          workflow_conclusion: success
          branch: mojo/26.2
          name: mesa-aar
          path: cryonixlauncher/libs

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.14.3"

      - name: Set up JDK 17
        uses: actions/setup-java@v3
        with:
          distribution: 'temurin'
          java-version: '17'
      - name: Prepare Cryonix renderer native libraries
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p cryonixlauncher/src/main/jniLibs
          for abi in arm64-v8a armeabi-v7a x86 x86_64; do
            mkdir -p "cryonixlauncher/src/main/jniLibs/$abi"
          done

          # MobileGlues official V2.0.0 release. The APK contains the real
          # per-ABI libmobileglues.so binaries; extract them without renaming.
          curl -L --fail --retry 3 -o /tmp/MobileGlues.apk https://github.com/MobileGL-Dev/MobileGlues-release/releases/download/V2.0.0/MobileGlues_2.0.0.apk
          for abi in arm64-v8a armeabi-v7a x86 x86_64; do
            unzip -p /tmp/MobileGlues.apk "lib/$abi/libmobileglues.so" > "cryonixlauncher/src/main/jniLibs/$abi/libmobileglues.so"
            test -s "cryonixlauncher/src/main/jniLibs/$abi/libmobileglues.so"
          done

          # Krypton Wrapper / NG-GL4ES: use real native libraries
          # shipped by the official PojavLauncher legacy release.
          curl -L --fail --retry 3 -o /tmp/Pojavlauncher-release.apk https://github.com/TeamPojavLauncher/PojavLauncher/releases/download/pojav-legacy/Pojavlauncher-release.apk
          for abi in arm64-v8a armeabi-v7a x86 x86_64; do
            unzip -p /tmp/Pojavlauncher-release.apk "lib/$abi/libng_gl4es.so" > "cryonixlauncher/src/main/jniLibs/$abi/libng_gl4es.so"
            test -s "cryonixlauncher/src/main/jniLibs/$abi/libng_gl4es.so"
          done

          echo "Cryonix renderer libraries:"
          find "$GITHUB_WORKSPACE/cryonixlauncher/src/main/jniLibs" -type f -name '*.so' -printf '%p %s bytes\\n' | sort

      - name: Create out directory
        run: mkdir out
      - name: Build Publishing .aab
        if: github.repository_owner == 'MojoLauncher' && github.ref_name == 'v3_openjdk'
        run: |
          gradle :app_pojavlauncher:bundleFullGplay
          mv cryonixlauncher/build/outputs/bundle/fullGplay/app_pojavlauncher-full-gplay.aab out/app-gplay.aab

      # Cryonix APK build trigger / artifact pipeline.
      - name: Build Debug .apk
        run: |
          # Build the launcher
          gradle :app_pojavlauncher:assembleFullDebug
          mv cryonixlauncher/build/outputs/apk/full/debug/app_pojavlauncher-full-debug.apk out/cryonixlauncher-arm-x64.apk

      - name: Build Debug .apk (No runtime)
        run: |
          gradle :app_pojavlauncher:assembleNoruntimeDebug
          mv cryonixlauncher/build/outputs/apk/noruntime/debug/app_pojavlauncher-noruntime-debug.apk out/app-debug-noruntime.apk
      - name: Build Nightly Release .apk
        if: github.repository_owner == 'MojoLauncher' && github.ref_name == 'v3_openjdk'
        run: |
          gradle :app_pojavlauncher:assembleFullPubRelease
          mv cryonixlauncher/build/outputs/apk/full/pubRelease/app_pojavlauncher-full-pubRelease.apk out/MojoLauncher-release.apk
      - name: Gen md5sums
        run: |
          md5sum out/cryonixlauncher-arm-x64.apk > out/cryonixlauncher-arm-x64.md5
          md5sum out/app-debug-noruntime.apk > out/app-debug-noruntime.md5

      - name: Upload Debug APK
        uses: actions/upload-artifact@v4
        with:
          name: cryonixlauncher-arm-x64
          path: out/cryonixlauncher-arm-x64.apk

      - name: Upload Debug APK (No runtime)
        uses: actions/upload-artifact@v4
        with:
          name: app-debug-noruntime
          path: out/app-debug-noruntime.apk

      - name: Publish Cryonix Launcher V3 release
        if: github.ref == 'refs/heads/arena/01a0f7a1-cryonixlauncherv2'
        uses: softprops/action-gh-release@v3
        with:
          tag_name: v3.0.0
          name: Cryonix Launcher V3
          prerelease: false
          generate_release_notes: false
          body: |
            # Cryonix Launcher V3

            Cryonix Launcher V3 is the current mobile-focused Minecraft launcher build.

            ## Highlights
            - Cryonix Launcher V3 interface and branding
            - Stable Cryonix launcher colour palette
            - Cryonix notification and background-task icons
            - Account management and launcher instance management
            - Discord account-linking foundation
            - Mobile renderer runtime packaging, including MobileGlues and Krypton/NG-GL4ES libraries
            - Existing launcher backend and Minecraft services preserved

            ## APK
            This release includes the current runtime APK built by GitHub Actions.

            **Build commit:** ${{ github.sha }}
          files: |
            out/cryonixlauncher-arm-x64.apk
            out/cryonixlauncher-arm-x64.md5

      - name: Release Nightly APK
        if: github.repository_owner == 'MojoLauncher' && github.ref_name == 'v3_openjdk'
        uses: softprops/action-gh-release@v3
        with:
          name: MojoLauncher Nightly Builds
          prerelease: true
          tag_name: nightly
          body: |
            MojoLauncher nightly build.
            Commit hash: ${{ github.sha }}
          files: |
            out/MojoLauncher-release.apk

      - name: Upload AAB
        if: github.repository_owner == 'MojoLauncher' && github.ref_name == 'v3_openjdk'
        uses: actions/upload-artifact@v4
        with:
          name: app-release-aab
          path: out/app-gplay.aab

      - name: Upload onto the Google Play testing track
        continue-on-error: true
        if: github.repository_owner == 'MojoLauncher' && github.ref_name == 'v3_openjdk'
        uses: r0adkll/upload-google-play@v1.1.5
        with:
          serviceAccountJsonPlainText: ${{ secrets.SERVICE_JSON }}
          packageName: git.artdeell.mjlaunch
          releaseFiles: out/app-gplay.aab
          track: internal
          inAppUpdatePriority: 5
